<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- コッペパン（イラスト） -->
  <defs>
    <radialGradient id="roll" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#e3a258"/>
      <stop offset="0.6" stop-color="#b76a2c"/>
      <stop offset="1" stop-color="#7d3b14"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f3e3bf"/>
  <circle cx="20" cy="20" r="3" fill="#e2cc9c"/><circle cx="380" cy="40" r="3" fill="#e2cc9c"/><circle cx="40" cy="270" r="3" fill="#e2cc9c"/><circle cx="360" cy="260" r="3" fill="#e2cc9c"/>
  <!-- 紙袋のしき紙 -->
  <rect x="45" y="200" width="310" height="55" rx="6" fill="#d9b98a" stroke="#3d2817" stroke-width="4"/>
  <path d="M45 215 H355" stroke="#3d2817" stroke-width="2" stroke-dasharray="4 8"/>
  <!-- 奥のコッペパン -->
  <g transform="rotate(-8 200 130)">
    <rect x="70" y="80" width="250" height="80" rx="40" fill="url(#roll)" stroke="#3d2817" stroke-width="4"/>
    <path d="M110 100 Q170 88 230 92" fill="none" stroke="#f6c98e" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  </g>
  <!-- 手前のコッペパン（ジャムとマーガリンをはさんだもの） -->
  <rect x="85" y="140" width="250" height="80" rx="40" fill="url(#roll)" stroke="#3d2817" stroke-width="4"/>
  <path d="M110 178 Q210 160 312 178" fill="none" stroke="#3d2817" stroke-width="4" stroke-linecap="round"/>
  <path d="M115 180 Q210 166 307 180 Q210 190 115 180 Z" fill="#fff3c2"/>
  <path d="M120 183 Q210 176 302 183" fill="none" stroke="#a63d2a" stroke-width="5" stroke-linecap="round"/>
  <path d="M120 158 Q170 146 230 150" fill="none" stroke="#f6c98e" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
</svg>
