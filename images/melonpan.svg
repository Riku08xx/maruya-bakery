<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- メロンパン（イラスト） -->
  <defs>
    <radialGradient id="top" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fbe4a0"/>
      <stop offset="0.6" stop-color="#e8b85a"/>
      <stop offset="1" stop-color="#b9802f"/>
    </radialGradient>
    <clipPath id="dome"><ellipse cx="200" cy="165" rx="118" ry="85"/></clipPath>
  </defs>
  <rect width="400" height="300" fill="#f3e3bf"/>
  <circle cx="20" cy="20" r="3" fill="#e2cc9c"/><circle cx="380" cy="40" r="3" fill="#e2cc9c"/><circle cx="40" cy="270" r="3" fill="#e2cc9c"/><circle cx="360" cy="260" r="3" fill="#e2cc9c"/>
  <!-- 紙のしき紙 -->
  <rect x="70" y="195" width="260" height="55" rx="6" fill="#fbf4e2" stroke="#3d2817" stroke-width="4" transform="rotate(-3 200 220)"/>
  <!-- パン -->
  <ellipse cx="200" cy="165" rx="118" ry="85" fill="url(#top)" stroke="#3d2817" stroke-width="4"/>
  <!-- 格子もよう -->
  <g clip-path="url(#dome)" stroke="#b9802f" stroke-width="4" opacity="0.8">
    <path d="M60 80 L260 280 M100 60 L300 260 M140 40 L340 240 M180 20 L380 220 M20 100 L220 300"/>
    <path d="M340 80 L140 280 M300 60 L100 260 M260 40 L60 240 M220 20 L20 220 M380 100 L180 300"/>
  </g>
  <ellipse cx="200" cy="165" rx="118" ry="85" fill="none" stroke="#3d2817" stroke-width="4"/>
  <!-- 砂糖のつぶ -->
  <g fill="#fffaf0"><circle cx="150" cy="130" r="2.5"/><circle cx="175" cy="115" r="2"/><circle cx="230" cy="125" r="2.5"/><circle cx="260" cy="160" r="2"/><circle cx="185" cy="175" r="2.5"/><circle cx="140" cy="175" r="2"/><circle cx="215" cy="200" r="2"/></g>
  <path d="M130 120 Q160 95 200 92" fill="none" stroke="#fff6d8" stroke-width="9" stroke-linecap="round" opacity="0.6"/>
</svg>
