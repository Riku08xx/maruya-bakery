<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- クリームパン（イラスト） -->
  <defs>
    <radialGradient id="glove" cx="40%" cy="30%" r="80%">
      <stop offset="0" stop-color="#e9a65a"/>
      <stop offset="0.6" stop-color="#bf7031"/>
      <stop offset="1" stop-color="#874017"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#f3e3bf"/>
  <circle cx="20" cy="20" r="3" fill="#e2cc9c"/><circle cx="380" cy="40" r="3" fill="#e2cc9c"/><circle cx="40" cy="270" r="3" fill="#e2cc9c"/><circle cx="360" cy="260" r="3" fill="#e2cc9c"/>
  <!-- お皿 -->
  <ellipse cx="200" cy="225" rx="160" ry="40" fill="#fbf4e2" stroke="#3d2817" stroke-width="4"/>
  <!-- グローブ型のパン（切れ目4つ） -->
  <path d="M70 200
           Q60 120 120 95
           Q170 75 230 80
           L245 100 L262 84
           Q285 88 300 102
           L304 125 L322 117
           Q338 135 340 155
           L326 168 L342 182
           Q340 205 315 215
           Z" fill="url(#glove)" stroke="#3d2817" stroke-width="4" stroke-linejoin="round"/>
  <path d="M105 125 Q130 100 170 95" fill="none" stroke="#f6c98e" stroke-width="9" stroke-linecap="round" opacity="0.7"/>
  <!-- 半分に割ったクリームパン -->
  <g transform="translate(120 205)">
    <path d="M-45 0 Q-45 -40 0 -42 Q45 -40 45 0 Z" fill="#b8672a" stroke="#3d2817" stroke-width="4"/>
    <path d="M-35 0 Q-35 -30 0 -31 Q35 -30 35 0 Z" fill="#fbf0d6"/>
    <path d="M-24 0 Q-24 -20 0 -21 Q24 -20 24 0 Z" fill="#f6d36b" stroke="#d9a93a" stroke-width="2"/>
  </g>
</svg>
